<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebGPU × MapLibre — mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f14">
<meta name="description" content="MapLibre GL basemap with a WebGPU particle overlay, tuned for iOS Safari.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root { --bg:#0b0f14; --fg:#e8f0f7; --muted:#8fa3b5; --accent:#39d0ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font:14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-text-size-adjust:100%; overscroll-behavior:none; }
  #app { position:fixed; inset:0; height:100dvh; }
  #map { position:absolute; inset:0; }
  /* canvas is a replaced element: inset alone won't stretch it, it needs a size */
  #gpu { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
  .panel { position:absolute; z-index:2; left:max(12px, env(safe-area-inset-left));
    right:max(12px, env(safe-area-inset-right)); bottom:calc(12px + env(safe-area-inset-bottom));
    background:rgba(12,18,25,.72); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.10); border-radius:16px; padding:12px 14px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .panel .col { flex:1 0 100%; min-width:0; }   /* title gets its own row */
  .title { font-weight:600; letter-spacing:.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  button { appearance:none; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06);
    color:var(--fg); font:inherit; font-weight:600; padding:10px 14px; border-radius:12px;
    min-height:44px; touch-action:manipulation; }
  button:active { background:rgba(255,255,255,.14); }
  #badge { position:absolute; z-index:2; top:calc(10px + env(safe-area-inset-top));
    left:max(12px, env(safe-area-inset-left)); font-size:11px; letter-spacing:.4px; text-transform:uppercase;
    color:var(--muted); background:rgba(12,18,25,.72); border:1px solid rgba(255,255,255,.10);
    padding:6px 10px; border-radius:999px; -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
  #badge b { color:var(--accent); }
  #levels { margin-right:auto; display:flex; gap:3px; align-items:flex-end; height:22px; width:52px; }
  #levels i { flex:1; background:linear-gradient(#39d0ff, #ff59bf); border-radius:2px;
    height:2px; transform-origin:bottom; transition:height .06s linear; }
  #mic[data-on="1"], #geo[data-on="1"] { border-color:rgba(57,208,255,.55); background:rgba(57,208,255,.16); }
  #geo { padding:10px 12px; font-size:16px; line-height:1; }
  .maplibregl-ctrl-attrib { font-size:10px; }
  /* the panel's ◎ button drives GeolocateControl, so hide its default UI */
  .maplibregl-ctrl-top-right { display:none; }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <canvas id="gpu"></canvas>
  <div id="badge">renderer: <b id="mode">…</b> · <span id="fps">–</span> fps</div>
  <div class="panel">
    <div class="col">
      <div class="title" id="routeName">Route</div>
      <div class="sub" id="status">starting…</div>
    </div>
    <div id="levels" aria-hidden="true"><i></i><i></i><i></i></div>
    <button id="geo" type="button" data-on="0" title="Show my location">◎</button>
    <button id="mic" type="button" data-on="0">Mic</button>
    <button id="toggle" type="button">Pause</button>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module">
const CENTER = [-73.5673, 45.5019];   // Montréal
const PARTICLES = 4000, MAX_HUBS = 1024;
const ROUTE_URL = 'route.geojson';

const statusEl = document.getElementById('status');
const modeEl   = document.getElementById('mode');
const fpsEl    = document.getElementById('fps');

/* ---------------------------------------------------------- basemap ---- */
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center: CENTER, zoom: 12.2, pitch: 45, bearing: -18,
  // iOS-friendly interaction
  pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
  cooperativeGestures: false,
  attributionControl: { compact: true }
});
map.touchZoomRotate.enable({ around: 'center' });
map.touchPitch.enable();
map.on('error', e => console.warn('map', e && e.error));

/* --------------------------------------------------------- the data ---- */
// The swarm rides the GPX polyline itself: the track is resampled at a fixed
// spacing so travel is arc-length uniform, and every particle is just an offset
// along that path. Filled in once route.geojson loads.
let HUBS = 0;
let hubs = [];
let hubPx = new Float32Array(0);
let particles = new Float32Array(0);

let seed = 1337;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

// resample a lon/lat polyline into `n` evenly spaced points (planar is fine at
// city scale, with a cos(lat) correction so distances aren't skewed)
function densify(coords, n) {
  const k = Math.cos(coords[0][1] * Math.PI / 180);
  const seg = [], cum = [0];
  for (let i = 1; i < coords.length; i++) {
    const dx = (coords[i][0] - coords[i - 1][0]) * k, dy = coords[i][1] - coords[i - 1][1];
    seg.push(Math.hypot(dx, dy));
    cum.push(cum[i - 1] + seg[i - 1]);
  }
  const total = cum[cum.length - 1], out = [];
  let j = 1;
  for (let i = 0; i < n; i++) {
    const d = (i / (n - 1)) * total;
    while (j < cum.length - 1 && cum[j] < d) j++;
    const t = seg[j - 1] ? (d - cum[j - 1]) / seg[j - 1] : 0;
    out.push([
      coords[j - 1][0] + (coords[j][0] - coords[j - 1][0]) * t,
      coords[j - 1][1] + (coords[j][1] - coords[j - 1][1]) * t
    ]);
  }
  return out;
}

function buildSwarm(coords) {
  hubs = densify(coords, Math.min(MAX_HUBS, 600));
  HUBS = hubs.length;
  hubPx = new Float32Array(HUBS * 2);
  particles = new Float32Array(PARTICLES * 4);
  for (let i = 0; i < PARTICLES; i++) {
    particles.set([
      rnd(),                       // offset along the whole loop
      0.012 + rnd() * 0.022,       // laps per second
      (rnd() - 0.5) * 5.0,         // px of lateral scatter -> a ribbon, not a wire
      0.6 + rnd() * 0.9            // size seed
    ], i * 4);
  }
}

function projectHubs() {
  for (let i = 0; i < HUBS; i++) {
    const p = map.project(hubs[i]);
    hubPx[i * 2] = p.x; hubPx[i * 2 + 1] = p.y;
  }
}

/* ------------------------------------------------------- the route ---- */
// GPX loop converted to GeoJSON at build time: one LineString + hotspot points.
let routeGlow = null;   // paint handle pulsed by the audio

async function addRoute() {
  const res = await fetch(ROUTE_URL, { cache: 'no-cache' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const gj = await res.json();
  const line = gj.features.find(f => f.geometry.type === 'LineString');
  if (!line) throw new Error('no LineString in ' + ROUTE_URL);

  map.addSource('route', { type: 'geojson', data: gj, lineMetrics: true }); // lineMetrics: needed by line-gradient

  // wide soft halo
  map.addLayer({
    id: 'route-glow', type: 'line', source: 'route',
    filter: ['==', ['geometry-type'], 'LineString'],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: {
      'line-color': '#39d0ff', 'line-opacity': 0.35, 'line-blur': 12,
      'line-width': ['interpolate', ['linear'], ['zoom'], 11, 10, 16, 26]
    }
  });
  // bright core, magenta→cyan along the loop
  map.addLayer({
    id: 'route-line', type: 'line', source: 'route',
    filter: ['==', ['geometry-type'], 'LineString'],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: {
      'line-width': ['interpolate', ['linear'], ['zoom'], 11, 2.5, 16, 6],
      'line-gradient': ['interpolate', ['linear'], ['line-progress'],
        0, '#39d0ff', 0.35, '#7be0ff', 0.6, '#ff59bf', 1, '#ffd166']
    }
  });

  // hotspots
  map.addLayer({
    id: 'route-dots', type: 'circle', source: 'route',
    filter: ['==', ['get', 'kind'], 'hotspot'],
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 11, 3.5, 16, 8],
      'circle-color': '#ffd166', 'circle-opacity': 0.95,
      'circle-stroke-color': '#0b0f14', 'circle-stroke-width': 1.5
    }
  });
  map.addLayer({
    id: 'route-start', type: 'circle', source: 'route',
    filter: ['==', ['get', 'kind'], 'start'],
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 11, 6, 16, 12],
      'circle-color': '#39d0ff', 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 2
    }
  });
  map.addSource('route-labels', {
    type: 'geojson',
    data: { type: 'FeatureCollection', features: gj.features.filter(f => f.geometry.type === 'Point') }
  });
  map.addLayer({
    id: 'route-labels', type: 'symbol', source: 'route-labels',
    filter: ['in', ['get', 'kind'], ['literal', ['hotspot', 'start']]],
    layout: {
      'text-field': ['get', 'name'], 'text-size': 11, 'text-offset': [0, 1.3],
      'text-anchor': 'top', 'text-optional': true,
      'text-font': ['Open Sans Regular']  // fontstack served by the CARTO style
    },
    paint: { 'text-color': '#e8f0f7', 'text-halo-color': '#0b0f14', 'text-halo-width': 1.6 }
  });

  // tap a hotspot for its description
  const popup = new maplibregl.Popup({ closeButton: true, offset: 12, maxWidth: '260px' });
  for (const id of ['route-dots', 'route-start']) {
    map.on('click', id, e => {
      const f = e.features[0];
      popup.setLngLat(f.geometry.coordinates)
           .setHTML(`<strong>${f.properties.name}</strong><br>${f.properties.desc || ''}`)
           .addTo(map);
    });
  }

  const coords = line.geometry.coordinates;
  const b = coords.reduce((acc, c) => acc.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
  map.fitBounds(b, { padding: { top: 70, bottom: 150, left: 40, right: 40 }, duration: 0 });

  buildSwarm(coords);
  routeGlow = true;
  document.getElementById('routeName').textContent = gj.name || 'Route';
  statusEl.textContent = `${coords.length} nodes · ${gj.features.length - 1} hotspots`;
}

/* ------------------------------------------------------ gpu overlay ---- */
const canvas = document.getElementById('gpu');
const dpr = () => Math.min(window.devicePixelRatio || 1, 2);
let running = true, backend = null;

const WGSL = /* wgsl */`
struct Globals {
  res: vec2f, time: f32, dpr: f32,
  bass: f32, mid: f32, treble: f32, beat: f32,
  count: f32, pad0: f32, pad1: f32, pad2: f32
};
@group(0) @binding(0) var<uniform> G: Globals;
@group(0) @binding(1) var<storage, read> hubs: array<vec2f>;
@group(0) @binding(2) var<storage, read> parts: array<vec4f>;

struct VSOut {
  @builtin(position) pos: vec4f,
  @location(0) uv: vec2f,
  @location(1) tint: vec3f,
  @location(2) fade: f32,
};

const QUAD = array<vec2f, 6>(
  vec2f(-1.,-1.), vec2f(1.,-1.), vec2f(-1.,1.),
  vec2f(-1., 1.), vec2f(1.,-1.), vec2f( 1.,1.)
);

@vertex
fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VSOut {
  let p = parts[ii];
  let n = u32(G.count);

  // p.x = offset along the loop, p.y = laps/second. G.time carries the
  // audio-accelerated clock, so tempo follows the music without jumping.
  let s = fract(p.x + G.time * p.y);
  let f = s * (G.count - 1.0);
  let i = min(u32(floor(f)), n - 2u);
  let a = hubs[i];
  let b = hubs[i + 1u];
  let dir = normalize(b - a + vec2f(1e-6, 0.));
  let nrm = vec2f(-dir.y, dir.x);

  // ride the polyline, scattered sideways into a ribbon that mids widen
  let lateral = p.z * (1.0 + G.mid * 1.8);
  let center = mix(a, b, fract(f)) + nrm * lateral;

  // bass swells every particle, the beat pulse kicks a subset of them
  let kick = G.beat * step(0.55, fract(p.x * 31.7));
  let size = (1.1 + p.w) * (1.0 + G.bass * 1.6 + kick * 1.2) * G.dpr;
  let corner = QUAD[vi];
  let px = center * G.dpr + corner * size;

  var o: VSOut;
  o.pos = vec4f(px / G.res * vec2f(2., -2.) + vec2f(-1., 1.), 0., 1.);
  o.uv = corner;
  // colour follows position along the loop, matching the route gradient,
  // and treble pushes the whole thing hotter
  let hue = clamp(s + G.treble * 0.35, 0., 1.);
  o.tint = mix(vec3f(0.22, 0.82, 1.0), vec3f(1.0, 0.35, 0.75), hue)
         + vec3f(G.treble * 0.25);
  o.fade = (0.55 + 0.75 * G.bass + kick * 0.8)
         * (1.0 - smoothstep(2.0, 5.0, abs(lateral)) * 0.5);
  return o;
}

@fragment
fn fs(i: VSOut) -> @location(0) vec4f {
  let r = length(i.uv);
  let glow = pow(clamp(1. - r, 0., 1.), 2.4);
  let a = glow * i.fade;
  return vec4f(i.tint * a, a);   // premultiplied, additive-ish blend
}`;

async function initWebGPU() {
  if (!('gpu' in navigator)) throw new Error('navigator.gpu missing');
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'low-power' });
  if (!adapter) throw new Error('no GPU adapter');
  const device = await adapter.requestDevice();
  const ctx = canvas.getContext('webgpu');
  if (!ctx) throw new Error('no webgpu context');
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format, alphaMode: 'premultiplied' });

  const module = device.createShaderModule({ code: WGSL });
  const pipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module, entryPoint: 'vs' },
    fragment: { module, entryPoint: 'fs', targets: [{
      format,
      blend: {
        color: { srcFactor: 'one', dstFactor: 'one' },
        alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' }
      }
    }] },
    primitive: { topology: 'triangle-list' }
  });

  const uni = device.createBuffer({ size: 48, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const hubBuf = device.createBuffer({ size: MAX_HUBS * 8, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const partBuf = device.createBuffer({ size: PARTICLES * 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(partBuf, 0, particles);

  const bind = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: uni } },
      { binding: 1, resource: { buffer: hubBuf } },
      { binding: 2, resource: { buffer: partBuf } }
    ]
  });

  const u = new Float32Array(12);
  device.lost.then(info => { backend = null; modeEl.textContent = 'lost'; statusEl.textContent = 'GPU device lost: ' + info.reason; });

  return {
    name: 'webgpu',
    draw(t) {
      u[0] = canvas.width; u[1] = canvas.height; u[2] = t; u[3] = dpr();
      u[4] = audio.bass; u[5] = audio.mid; u[6] = audio.treble; u[7] = audio.beat;
      u[8] = HUBS;
      device.queue.writeBuffer(uni, 0, u);
      device.queue.writeBuffer(hubBuf, 0, hubPx);

      const enc = device.createCommandEncoder();
      const pass = enc.beginRenderPass({ colorAttachments: [{
        view: ctx.getCurrentTexture().createView(),
        clearValue: { r: 0, g: 0, b: 0, a: 0 },
        loadOp: 'clear', storeOp: 'store'
      }] });
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, bind);
      pass.draw(6, PARTICLES);
      pass.end();
      device.queue.submit([enc.finish()]);
    }
  };
}

/* ------------------------------------------------------ audio input ---- */
// Live mic analysis. iOS Safari requires a user gesture AND https to start an
// AudioContext / getUserMedia, so this is only ever wired to the Mic button.
const IDLE = { bass: 0.30, mid: 0.20, treble: 0.15 };
const audio = {
  on: false, bass: IDLE.bass, mid: IDLE.mid, treble: IDLE.treble, beat: 0,
  ctx: null, analyser: null, stream: null, bins: null,
  env: 0,          // slow bass envelope, used as the beat threshold
  flow: 0          // audio-accelerated clock driving particle travel
};

async function micOn() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC || !navigator.mediaDevices?.getUserMedia) throw new Error('no Web Audio / mic API');
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
  });
  const ctx = new AC();
  await ctx.resume();                       // iOS starts contexts suspended
  const src = ctx.createMediaStreamSource(stream);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 1024;                  // 512 bins, cheap enough for a phone
  analyser.smoothingTimeConstant = 0.75;
  src.connect(analyser);                    // never connect to destination: feedback
  audio.ctx = ctx; audio.analyser = analyser; audio.stream = stream;
  audio.bins = new Uint8Array(analyser.frequencyBinCount);
  audio.on = true;
}

function micOff() {
  audio.on = false;
  audio.stream?.getTracks().forEach(t => t.stop());
  audio.ctx?.close();
  audio.ctx = audio.analyser = audio.stream = null;
  audio.bass = IDLE.bass; audio.mid = IDLE.mid; audio.treble = IDLE.treble; audio.beat = 0;
}

const bars = [...document.querySelectorAll('#levels i')];
function sampleAudio(dt) {
  if (audio.on && audio.analyser) {
    audio.analyser.getByteFrequencyData(audio.bins);
    const n = audio.bins.length, sr = audio.ctx.sampleRate;
    const hz = i => (i * sr) / (n * 2);
    const band = (lo, hi) => {
      let s = 0, c = 0;
      for (let i = 1; i < n; i++) { const f = hz(i); if (f >= lo && f < hi) { s += audio.bins[i]; c++; } }
      return c ? s / c / 255 : 0;
    };
    // perceptual-ish curve, then attack fast / release slow so it feels musical
    const shape = v => Math.min(1, Math.pow(v, 1.6) * 2.2);
    const ease = (cur, next) => cur + (next - cur) * (next > cur ? 0.55 : 0.10);
    audio.bass   = ease(audio.bass,   shape(band(20, 180)));
    audio.mid    = ease(audio.mid,    shape(band(180, 2000)));
    audio.treble = ease(audio.treble, shape(band(2000, 12000)));

    // beat = bass jumping above its own running average
    audio.env += (audio.bass - audio.env) * 0.05;
    if (audio.bass > audio.env * 1.35 + 0.08) audio.beat = 1;
    audio.beat = Math.max(0, audio.beat - dt * 3.5);
  }
  if (bars.length) {
    bars[0].style.height = (2 + audio.bass   * 20) + 'px';
    bars[1].style.height = (2 + audio.mid    * 20) + 'px';
    bars[2].style.height = (2 + audio.treble * 20) + 'px';
  }
  // particles speed up with the low end
  audio.flow += dt * (0.6 + audio.bass * 2.4 + audio.beat * 0.8);

  // the route halo breathes with the bass
  if (audio.on && routeGlow && map.getLayer('route-glow')) {
    map.setPaintProperty('route-glow', 'line-opacity', 0.30 + audio.bass * 0.45 + audio.beat * 0.15);
  }
}

// Canvas2D fallback so the page still works on iOS versions without WebGPU.
function init2D() {
  const c = canvas.getContext('2d');
  const N = Math.min(PARTICLES, 1200);
  return {
    name: 'canvas2d',
    draw(t) {
      const s = dpr();
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, canvas.width, canvas.height);
      c.globalCompositeOperation = 'lighter';
      for (let i = 0; i < N; i++) {
        const o = i * 4;
        const u = (particles[o] + t * particles[o + 1]) % 1;   // offset along the loop
        const f = u * (HUBS - 1);
        const j = Math.min(HUBS - 2, f | 0), ft = f - j;
        const ax = hubPx[j * 2], ay = hubPx[j * 2 + 1];
        const bx = hubPx[j * 2 + 2], by = hubPx[j * 2 + 3];
        const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
        const lat = particles[o + 2] * (1 + audio.mid * 1.8);
        const x = (ax + dx * ft - (dy / len) * lat) * s;
        const y = (ay + dy * ft + (dx / len) * lat) * s;
        const kick = audio.beat * (((i * 7) % 10) > 5 ? 1 : 0);
        const r = (1.1 + particles[o + 3]) * (1 + audio.bass * 1.6 + kick * 1.2) * s;
        const g = Math.round(210 - u * 90);
        c.fillStyle = `rgba(${90 + u * 160 + audio.treble * 60 | 0},${g},255,${0.35 + audio.bass * 0.6})`;
        c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.fill();
      }
    }
  };
}

/* ------------------------------------------------------ my location ---- */
// GeolocateControl gives us the blue dot, accuracy halo and heading cone. Its
// trigger() silently returns false if it isn't set up yet (or if the browser
// reports no support), so everything below also has a raw-API fallback and
// always says out loud what actually happened.
const geolocate = new maplibregl.GeolocateControl({
  positionOptions: { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 },
  trackUserLocation: true,
  showUserLocation: true,
  showAccuracyCircle: true,
  showUserHeading: true
});
map.addControl(geolocate, 'top-right');

const geoBtn = document.getElementById('geo');
let here = null, watchId = null, ownMarker = null, controlOn = false;

// metres between two lon/lat pairs (equirectangular is plenty at this scale)
function metres(a, b) {
  const k = Math.cos(a[1] * Math.PI / 180) * 111320, m = 110540;
  return Math.hypot((b[0] - a[0]) * k, (b[1] - a[1]) * m);
}

// how far the user is from the nearest point of the densified track
function distanceToRoute(pos) {
  let best = Infinity;
  for (let i = 0; i < HUBS; i++) {
    const d = metres(pos, hubs[i]);
    if (d < best) best = d;
  }
  return best;
}

function reportPosition(coords) {
  here = [coords.longitude, coords.latitude];
  geoBtn.dataset.on = '1';
  if (!HUBS) { statusEl.textContent = 'located · ' + Math.round(coords.accuracy) + ' m accuracy'; return; }
  const d = distanceToRoute(here);
  statusEl.textContent = d < 60
    ? 'on the route · ' + Math.round(coords.accuracy) + ' m accuracy'
    : (d < 1000 ? Math.round(d) + ' m' : (d / 1000).toFixed(1) + ' km') + ' from the route';
}

// Geolocation errors are vague by design; say which one it is and what fixes it.
function reportGeoError(err) {
  geoBtn.dataset.on = '0';
  const why = {
    1: window.isSecureContext
       ? 'permission denied — allow Location for this site (iOS: Settings ▸ Apps ▸ Safari ▸ Location)'
       : 'permission denied — the page must be served over https',
    2: 'position unavailable — no fix yet, try outdoors or turn Location Services on',
    3: 'timed out waiting for a fix — try again'
  }[err && err.code] || (err && err.message) || 'unknown error';
  statusEl.textContent = 'location: ' + why;
  console.warn('geolocate', err);
}

geolocate.on('geolocate', e => { controlOn = true; reportPosition(e.coords); });
geolocate.on('trackuserlocationstart', () => { controlOn = true; });
geolocate.on('trackuserlocationend', () => { controlOn = false; if (watchId === null) geoBtn.dataset.on = '0'; });
geolocate.on('error', reportGeoError);

// Fallback path: our own marker driven by watchPosition, used when the control
// can't take the trigger.
function watchOurselves() {
  if (watchId !== null) return;
  statusEl.textContent = 'locating…';
  watchId = navigator.geolocation.watchPosition(pos => {
    const ll = [pos.coords.longitude, pos.coords.latitude];
    if (!ownMarker) {
      const el = document.createElement('div');
      el.style.cssText = 'width:18px;height:18px;border-radius:50%;background:#39d0ff;' +
                         'border:2px solid #fff;box-shadow:0 0 12px rgba(57,208,255,.9)';
      ownMarker = new maplibregl.Marker({ element: el }).setLngLat(ll).addTo(map);
      map.easeTo({ center: ll, zoom: Math.max(map.getZoom(), 14), duration: 800 });
    } else {
      ownMarker.setLngLat(ll);
    }
    reportPosition(pos.coords);
  }, err => {
    navigator.geolocation.clearWatch(watchId); watchId = null;
    reportGeoError(err);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
}

function stopWatching() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  ownMarker?.remove(); ownMarker = null;
  geoBtn.dataset.on = '0';
}

geoBtn.addEventListener('click', () => {
  if (!('geolocation' in navigator)) { statusEl.textContent = 'location: unsupported browser'; return; }
  if (!window.isSecureContext) {
    statusEl.textContent = 'location: needs https — open the https:// address';
    return;
  }
  if (watchId !== null || controlOn) {                 // second tap turns it off
    stopWatching();
    if (controlOn) { try { geolocate._clearWatch?.(); } catch (e) { console.warn(e); } controlOn = false; }
    statusEl.textContent = 'location off';
    return;
  }
  // trigger() returns false when the control isn't ready; fall back rather than
  // leaving the tap doing nothing
  let ok = false;
  try { ok = geolocate.trigger(); } catch (e) { console.warn('trigger', e); }
  if (ok === false) watchOurselves();
  else statusEl.textContent = 'locating…';
});

/* ------------------------------------------------------- main loop ----- */
function resize() {
  const s = dpr();
  const w = Math.round(map.getContainer().clientWidth * s);
  const h = Math.round(map.getContainer().clientHeight * s);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}

let frames = 0, fpsAt = performance.now(), rafId = 0, last = performance.now();
function frame(now) {
  rafId = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!running || !backend || !HUBS || document.hidden) return;
  resize();
  projectHubs();
  sampleAudio(dt);
  backend.draw(audio.flow);
  frames++;
  if (now - fpsAt > 500) {
    fpsEl.textContent = Math.round((frames * 1000) / (now - fpsAt));
    frames = 0; fpsAt = now;
  }
}

const micBtn = document.getElementById('mic');
micBtn.addEventListener('click', async () => {
  if (audio.on) {
    micOff();
    micBtn.dataset.on = '0'; micBtn.textContent = 'Mic';
    statusEl.textContent = `${PARTICLES} particles · ${HUBS} hubs`;
    return;
  }
  micBtn.disabled = true;
  statusEl.textContent = 'requesting microphone…';
  try {
    await micOn();
    micBtn.dataset.on = '1'; micBtn.textContent = 'Mute';
    statusEl.textContent = 'reacting to live audio';
  } catch (err) {
    statusEl.textContent = 'mic unavailable — ' + (err.name === 'NotAllowedError'
      ? 'permission denied (needs https)' : err.message);
    console.warn('mic failed:', err);
  } finally { micBtn.disabled = false; }
});

// iOS suspends the AudioContext when the page goes to the background.
document.addEventListener('visibilitychange', () => {
  if (!audio.ctx) return;
  if (document.hidden) audio.ctx.suspend(); else audio.ctx.resume();
});
window.addEventListener('pagehide', () => { if (audio.on) micOff(); });

document.getElementById('toggle').addEventListener('click', e => {
  running = !running;
  e.currentTarget.textContent = running ? 'Pause' : 'Resume';
  statusEl.textContent = !running ? 'paused'
    : audio.on ? 'reacting to live audio' : `${PARTICLES} particles · ${HUBS} hubs`;
});

// iOS Safari: don't burn battery in a backgrounded tab.
document.addEventListener('visibilitychange', () => { if (!document.hidden) fpsAt = performance.now(); });
window.addEventListener('pagehide', () => cancelAnimationFrame(rafId));
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(() => { map.resize(); resize(); }, 250));

// 'load' waits for basemap tiles too, so a slow or blocked tile server would
// leave the overlay dead. 'style.load' is all we need to add sources/layers.
map.once('style.load', async () => {
  try { await addRoute(); } catch (err) {
    console.warn('route failed:', err);
    statusEl.textContent = 'route failed to load — ' + err.message;
  }
  try {
    backend = await initWebGPU();
    modeEl.textContent = 'WebGPU';
    if (!HUBS) statusEl.textContent = `${PARTICLES} particles`;   // keep the route summary if we have one
  } catch (err) {
    backend = init2D();
    modeEl.textContent = 'Canvas2D';
    if (!HUBS) statusEl.textContent = 'WebGPU unavailable — ' + err.message;
    console.warn('WebGPU init failed:', err);
  }
  resize();
  rafId = requestAnimationFrame(frame);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebGPU × MapLibre — mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f14">
<meta name="description" content="MapLibre GL basemap with a WebGPU particle overlay, tuned for iOS Safari.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root { --bg:#0b0f14; --fg:#e8f0f7; --muted:#8fa3b5; --accent:#39d0ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font:14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-text-size-adjust:100%; overscroll-behavior:none; }
  #app { position:fixed; inset:0; height:100dvh; }
  #map { position:absolute; inset:0; }
  #gpu { position:absolute; inset:0; pointer-events:none; z-index:1; }
  .panel { position:absolute; z-index:2; left:max(12px, env(safe-area-inset-left));
    right:max(12px, env(safe-area-inset-right)); bottom:calc(12px + env(safe-area-inset-bottom));
    background:rgba(12,18,25,.72); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.10); border-radius:16px; padding:12px 14px;
    display:flex; align-items:center; gap:12px; }
  .panel .col { flex:1; min-width:0; }
  .title { font-weight:600; letter-spacing:.2px; }
  .sub { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  button { appearance:none; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06);
    color:var(--fg); font:inherit; font-weight:600; padding:10px 14px; border-radius:12px;
    min-height:44px; touch-action:manipulation; }
  button:active { background:rgba(255,255,255,.14); }
  #badge { position:absolute; z-index:2; top:calc(10px + env(safe-area-inset-top));
    left:max(12px, env(safe-area-inset-left)); font-size:11px; letter-spacing:.4px; text-transform:uppercase;
    color:var(--muted); background:rgba(12,18,25,.72); border:1px solid rgba(255,255,255,.10);
    padding:6px 10px; border-radius:999px; -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
  #badge b { color:var(--accent); }
  .maplibregl-ctrl-attrib { font-size:10px; }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <canvas id="gpu"></canvas>
  <div id="badge">renderer: <b id="mode">…</b> · <span id="fps">–</span> fps</div>
  <div class="panel">
    <div class="col">
      <div class="title">Transit flow</div>
      <div class="sub" id="status">starting…</div>
    </div>
    <button id="toggle" type="button">Pause</button>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module">
const CENTER = [-73.5673, 45.5019];   // Montréal
const HUBS = 48, PARTICLES = 4000;

const statusEl = document.getElementById('status');
const modeEl   = document.getElementById('mode');
const fpsEl    = document.getElementById('fps');

/* ---------------------------------------------------------- basemap ---- */
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center: CENTER, zoom: 12.2, pitch: 45, bearing: -18,
  // iOS-friendly interaction
  pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
  cooperativeGestures: false,
  attributionControl: { compact: true }
});
map.touchZoomRotate.enable({ around: 'center' });
map.touchPitch.enable();
map.on('error', e => console.warn('map', e && e.error));

/* --------------------------------------------------------- the data ---- */
// deterministic pseudo-random so the scene is stable across reloads
let seed = 1337;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

const hubs = Array.from({ length: HUBS }, () => [
  CENTER[0] + (rnd() - 0.5) * 0.14,
  CENTER[1] + (rnd() - 0.5) * 0.09
]);
// particle = [fromHub, toHub, phase, speed]
const particles = new Float32Array(PARTICLES * 4);
for (let i = 0; i < PARTICLES; i++) {
  const a = Math.floor(rnd() * HUBS);
  let b = Math.floor(rnd() * HUBS); if (b === a) b = (b + 1) % HUBS;
  particles.set([a, b, rnd(), 0.15 + rnd() * 0.5], i * 4);
}
const hubPx = new Float32Array(HUBS * 2);
function projectHubs() {
  for (let i = 0; i < HUBS; i++) {
    const p = map.project(hubs[i]);
    hubPx[i * 2] = p.x; hubPx[i * 2 + 1] = p.y;
  }
}

/* ------------------------------------------------------ gpu overlay ---- */
const canvas = document.getElementById('gpu');
const dpr = () => Math.min(window.devicePixelRatio || 1, 2);
let running = true, backend = null;

const WGSL = /* wgsl */`
struct Globals { res: vec2f, time: f32, dpr: f32 };
@group(0) @binding(0) var<uniform> G: Globals;
@group(0) @binding(1) var<storage, read> hubs: array<vec2f>;
@group(0) @binding(2) var<storage, read> parts: array<vec4f>;

struct VSOut {
  @builtin(position) pos: vec4f,
  @location(0) uv: vec2f,
  @location(1) tint: vec3f,
  @location(2) fade: f32,
};

const QUAD = array<vec2f, 6>(
  vec2f(-1.,-1.), vec2f(1.,-1.), vec2f(-1.,1.),
  vec2f(-1., 1.), vec2f(1.,-1.), vec2f( 1.,1.)
);

@vertex
fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VSOut {
  let p = parts[ii];
  let a = hubs[u32(p.x)];
  let b = hubs[u32(p.y)];

  // travel 0..1 along the route, looping
  let t = fract(p.z + G.time * p.w);
  // gentle arc so routes don't collapse onto straight lines
  let d = b - a;
  let n = normalize(vec2f(-d.y, d.x)) * length(d) * 0.14;
  let bend = sin(t * 3.14159265);
  let center = mix(a, b, t) + n * bend;

  let size = (1.6 + 2.2 * bend) * G.dpr;
  let corner = QUAD[vi];
  let px = center * G.dpr + corner * size;

  var o: VSOut;
  o.pos = vec4f(px / G.res * vec2f(2., -2.) + vec2f(-1., 1.), 0., 1.);
  o.uv = corner;
  o.tint = mix(vec3f(0.22, 0.82, 1.0), vec3f(1.0, 0.35, 0.75), fract(p.z * 7.13));
  // fade in/out at the endpoints, and cull anything far off-screen
  o.fade = smoothstep(0., 0.12, t) * smoothstep(1., 0.88, t);
  return o;
}

@fragment
fn fs(i: VSOut) -> @location(0) vec4f {
  let r = length(i.uv);
  let glow = pow(clamp(1. - r, 0., 1.), 2.4);
  let a = glow * i.fade;
  return vec4f(i.tint * a, a);   // premultiplied, additive-ish blend
}`;

async function initWebGPU() {
  if (!('gpu' in navigator)) throw new Error('navigator.gpu missing');
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'low-power' });
  if (!adapter) throw new Error('no GPU adapter');
  const device = await adapter.requestDevice();
  const ctx = canvas.getContext('webgpu');
  if (!ctx) throw new Error('no webgpu context');
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format, alphaMode: 'premultiplied' });

  const module = device.createShaderModule({ code: WGSL });
  const pipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module, entryPoint: 'vs' },
    fragment: { module, entryPoint: 'fs', targets: [{
      format,
      blend: {
        color: { srcFactor: 'one', dstFactor: 'one' },
        alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' }
      }
    }] },
    primitive: { topology: 'triangle-list' }
  });

  const uni = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const hubBuf = device.createBuffer({ size: hubPx.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const partBuf = device.createBuffer({ size: particles.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(partBuf, 0, particles);

  const bind = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: uni } },
      { binding: 1, resource: { buffer: hubBuf } },
      { binding: 2, resource: { buffer: partBuf } }
    ]
  });

  const u = new Float32Array(4);
  device.lost.then(info => { backend = null; modeEl.textContent = 'lost'; statusEl.textContent = 'GPU device lost: ' + info.reason; });

  return {
    name: 'webgpu',
    draw(t) {
      u[0] = canvas.width; u[1] = canvas.height; u[2] = t; u[3] = dpr();
      device.queue.writeBuffer(uni, 0, u);
      device.queue.writeBuffer(hubBuf, 0, hubPx);

      const enc = device.createCommandEncoder();
      const pass = enc.beginRenderPass({ colorAttachments: [{
        view: ctx.getCurrentTexture().createView(),
        clearValue: { r: 0, g: 0, b: 0, a: 0 },
        loadOp: 'clear', storeOp: 'store'
      }] });
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, bind);
      pass.draw(6, PARTICLES);
      pass.end();
      device.queue.submit([enc.finish()]);
    }
  };
}

// Canvas2D fallback so the page still works on iOS versions without WebGPU.
function init2D() {
  const c = canvas.getContext('2d');
  const N = Math.min(PARTICLES, 1200);
  return {
    name: 'canvas2d',
    draw(t) {
      const s = dpr();
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, canvas.width, canvas.height);
      c.globalCompositeOperation = 'lighter';
      for (let i = 0; i < N; i++) {
        const o = i * 4;
        const a0 = particles[o] | 0, b0 = particles[o + 1] | 0;
        const ax = hubPx[a0 * 2], ay = hubPx[a0 * 2 + 1];
        const bx = hubPx[b0 * 2], by = hubPx[b0 * 2 + 1];
        const p = (particles[o + 2] + t * particles[o + 3]) % 1;
        const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
        const bend = Math.sin(p * Math.PI);
        const x = (ax + dx * p - dy / len * len * 0.14 * bend) * s;
        const y = (ay + dy * p + dx / len * len * 0.14 * bend) * s;
        c.fillStyle = `rgba(90,210,255,${0.5 * bend})`;
        c.beginPath(); c.arc(x, y, (1.2 + 1.6 * bend) * s, 0, 6.2832); c.fill();
      }
    }
  };
}

/* ------------------------------------------------------- main loop ----- */
function resize() {
  const s = dpr();
  const w = Math.round(map.getContainer().clientWidth * s);
  const h = Math.round(map.getContainer().clientHeight * s);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}

let frames = 0, fpsAt = performance.now(), rafId = 0;
function frame(now) {
  rafId = requestAnimationFrame(frame);
  if (!running || !backend || document.hidden) return;
  resize();
  projectHubs();
  backend.draw(now / 1000);
  frames++;
  if (now - fpsAt > 500) {
    fpsEl.textContent = Math.round((frames * 1000) / (now - fpsAt));
    frames = 0; fpsAt = now;
  }
}

document.getElementById('toggle').addEventListener('click', e => {
  running = !running;
  e.currentTarget.textContent = running ? 'Pause' : 'Resume';
  statusEl.textContent = running ? `${PARTICLES} particles · ${HUBS} hubs` : 'paused';
});

// iOS Safari: don't burn battery in a backgrounded tab.
document.addEventListener('visibilitychange', () => { if (!document.hidden) fpsAt = performance.now(); });
window.addEventListener('pagehide', () => cancelAnimationFrame(rafId));
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(() => { map.resize(); resize(); }, 250));
// block double-tap-to-zoom on the chrome, keep it on the map
document.querySelector('.panel').addEventListener('touchend', e => e.preventDefault(), { passive: false });

map.on('load', async () => {
  try {
    backend = await initWebGPU();
    modeEl.textContent = 'WebGPU';
    statusEl.textContent = `${PARTICLES} particles · ${HUBS} hubs`;
  } catch (err) {
    backend = init2D();
    modeEl.textContent = 'Canvas2D';
    statusEl.textContent = 'WebGPU unavailable — ' + err.message;
    console.warn('WebGPU init failed:', err);
  }
  resize();
  rafId = requestAnimationFrame(frame);
});
</script>
</body>
</html>
